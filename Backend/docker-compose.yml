services:
  backend:
    image: ${DOCKER_USERNAME}/edunexus-backend:${BACKEND_IMAGE_TAG}
    container_name: edunexus-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - edunexus-network

networks:
  edunexus-network:
    driver: bridge
